<style>
/* The map page's look: the app's colours and shapes (app/page.css), here again because a map saved as a file opens
   with nothing else. Dark, as the app's pages start (the user's choice of 2026-11-07). */
:root { color-scheme: dark; --bg: #0f1115; --surface: #171a21; --fg: #e6e8eb; --muted: #9aa3af; --line: #2c323d; --panel: #1c2029;
        --link: #6b9bff; --pick: #1c2741; --warn: #f97066; --running: #3d3519; --done: #1e3325; --lost: #3d1f1f; }
* { box-sizing: border-box; }
/* The browser hides only HTML elements by their hidden attribute: the icons' sprite is an <svg>, and took 150px above the title */
[hidden] { display: none !important; }
body { margin: 0; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); }
a { color: var(--link); }
header { padding: 14px 20px 6px; } h1 { font-size: 20px; margin: 0 0 4px; } header p { margin: 0; color: var(--muted); }
header #back { display: inline-block; margin-bottom: 6px; text-decoration: none; }
h2 { font-size: 16px; margin: 28px 20px 4px; } h3 { font-size: 14px; margin: 20px 20px 4px; } p.note { margin: 4px 20px 8px; color: var(--muted); max-width: 70em; }
.legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 12px; }
/* Whether the program is still searching, or has seen everything: the first thing to read on the page */
#status { margin: 8px 0 4px; padding: 8px 12px; border-radius: 10px; border-left: 4px solid; color: var(--fg); max-width: 70em; }
#status.running { background: var(--running); border-color: #e0a100; } #status.done { background: var(--done); border-color: #1e8e3e; }
#status.lost { background: var(--lost); border-color: #b3261e; }
#status p.kiwi { margin: 0 0 4px; font-weight: 600; color: var(--warn); }
#status p { color: var(--fg); } #status strong { margin-right: 6px; }
/* Which sources answered: the ones that failed named first, in the colour of how badly */
#status p.sources { margin: 4px 0 0; } #status .source { margin-right: 12px; } #status .source.ok { color: var(--muted); }
#status .source.partly { color: #e0a100; } #status .source.down { color: var(--warn); font-weight: 600; }
#status p.lost-note { margin: 4px 0 0; }
#status details { margin-top: 4px; } #status details summary { cursor: pointer; color: var(--muted); }
#status details p { margin: 4px 0 0; color: var(--muted); max-width: 70em; } #status .pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #e0a100;
  margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { #status .pulse { animation: none; } }

/* The filters, as one bar above the map and the cards */
#filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 20px;
           background: var(--bg); border-bottom: 1px solid var(--line); }
#filters label { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--line);
                 border-radius: 999px; background: var(--surface); }
#filters label:has(input[type=checkbox]:checked) { border-color: var(--link); background: var(--pick); }
#filters input[type=checkbox] { margin: 0; accent-color: var(--link); }
#filters input[type=range] { width: 120px; vertical-align: middle; accent-color: var(--link); }
/* A limit: the box of its value as wide as the largest value, so that nothing moves while it changes */
#filters label.limit { gap: 4px; }
#filters label.limit input[type=range] { margin-left: 8px; }
#filters label.limit.set { border-color: var(--link); background: var(--pick); }
#filters input[type=number] { font: inherit; width: 5ch; padding: 1px 4px; text-align: right; font-variant-numeric: tabular-nums;
                              border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); -moz-appearance: textfield; }
#filters input[type=number]::-webkit-inner-spin-button, #filters input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
#filters input[type=number]:focus { outline: 2px solid var(--link); outline-offset: 1px; }
#filters .count { font-variant-numeric: tabular-nums; }
#filters select { font: inherit; border: 0; background: transparent; color: var(--fg); }
#filters button { font: inherit; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--link); background: var(--surface); color: var(--link); cursor: pointer; }
#filters .count { color: var(--muted); margin-left: auto; }

/* The cards beside the map, which stays in view while they scroll; on a phone the map comes first */
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; padding: 14px 20px; align-items: start; }
.split > * { min-width: 0; }   /* the line of an option scrolls inside the trip, it does not widen the page */
.side { position: sticky; top: 12px; height: calc(100vh - 24px); display: flex; flex-direction: column; gap: 10px; }
#map { flex: 1 1 auto; min-height: 280px; border-radius: 12px; border: 1px solid var(--line); }
#detail { flex: 0 1 auto; max-height: 58%; overflow: auto; background: var(--surface); padding: 12px 16px 16px; border: 1px solid var(--line); border-radius: 12px; }
ol.cards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ol.cards li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; }
ol.cards li:hover, ol.cards li:focus-visible { border-color: var(--link); outline: none; }
ol.cards li.picked { border-color: var(--link); background: var(--pick); }
ol.cards .top { display: flex; align-items: center; gap: 8px; }
ol.cards .top strong { flex: 1; min-width: 0; }
ol.cards .top .total { font-size: 17px; }
ol.cards .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
ol.cards p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
ol.cards p.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; margin-top: 6px; }
.badge { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--panel); color: var(--muted); }
.badge.looked_up { background: var(--done); color: #1e8e3e; } .badge.partly { background: var(--running); color: #a06d00; }
@media (max-width: 900px) {
  .split { display: flex; flex-direction: column-reverse; }
  .side { position: static; height: auto; } #map { height: 50vh; flex: none; } #detail { max-height: none; }
}

/* The trip of a destination */
#detail h2 { margin: 0 0 2px; } #detail h4 { margin: 14px 0 4px; font-size: 14px; } #detail p { margin: 2px 0; }
#detail .muted { color: var(--muted); } #detail ol { margin: 4px 0; padding-left: 20px; } #detail li { margin: 2px 0; }
#detail ul.links { margin: 6px 0 0; padding-left: 20px; } #detail .close, #detail .ask-price, #detail .switch-view { float: right; font: inherit; padding: 2px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
#detail .warn { color: var(--warn); }
#detail .ask-price, #detail .switch-view { margin-right: 6px; } #detail .ask-price:disabled { cursor: progress; color: var(--muted); }
#detail h5 { margin: 10px 0 0; font-size: 13px; color: var(--muted); }
/* A train or bus of the trip: its price at the right of its title, and in its ride */
#detail h4.ground-title { display: flex; align-items: baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 16px; }
#detail h4.ground-title .price { margin-left: auto; font-size: 17px; white-space: nowrap; }
#detail h4.ground-title .price.none { font-size: 13px; font-weight: 400; color: var(--muted); }
#detail ol.steps .what > p.ground-price { margin-top: 4px; } #detail p.ground-price strong { font-size: 15px; }
#detail pre { white-space: pre-wrap; word-break: break-all; background: var(--bg); padding: 6px 8px; border: 1px solid var(--line); }

/* The tables under the map: the cities by train or bus, and what was searched */
table { border-collapse: collapse; width: 100%; background: var(--surface); }
td, th { text-align: left; padding: 6px 20px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; background: var(--panel); } td.n { text-align: right; font-variant-numeric: tabular-nums; }
#ground-rows tr { cursor: pointer; } #ground-rows tr:hover, #ground-rows tr.picked { background: var(--pick); }
.wrap { overflow-x: auto; margin: 0 20px; border: 1px solid var(--line); border-radius: 12px; } #tiles { margin: 0; color: var(--muted); }
/* A trip from top to bottom, as the planner's option (app/page.css, ol.steps): a dot at each place, the vehicles between them */
.icon { width: 1.15em; height: 1.15em; vertical-align: -.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8;
        stroke-linecap: round; stroke-linejoin: round; }
#detail ol.steps { list-style: none; margin: 8px 0 12px; padding: 0; }
#detail ol.steps > li { display: grid; grid-template-columns: 56px 22px minmax(0, 1fr); column-gap: 10px; margin: 0; }
ol.steps .at { font-weight: 700; text-align: right; padding-top: 1px; font-variant-numeric: tabular-nums; }
ol.steps .rail { position: relative; display: flex; justify-content: center; }
ol.steps .rail::before { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--line); }
ol.steps > li:first-child .rail::before { top: 9px; } ol.steps > li:last-child .rail::before { bottom: calc(100% - 9px); }
ol.steps .rail b { position: relative; width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--fg); background: var(--surface); }
ol.steps .rail .icon { position: relative; margin-top: 2px; background: var(--surface); color: var(--muted); }
ol.steps li.ride .rail::before { width: 4px; background: var(--ride, var(--line)); border-radius: 2px; }
ol.steps .what { padding: 0 0 14px; min-width: 0; }
#detail ol.steps .what > p { margin: 0; } #detail ol.steps .what > p.muted { font-size: .9em; margin-top: 4px; }
ol.steps .what > p.quote { font-style: italic; }
#detail ol.steps ul.vehicles { list-style: none; margin: 4px 0 0; padding: 0; font-size: .95em; color: var(--muted); }
#detail ol.steps ul.vehicles li { display: flex; gap: 6px; align-items: baseline; margin: 1px 0; }
#detail ol.steps ul.vehicles li.change { font-size: .9em; padding-left: 1.6em; }
ol.steps .facts { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: .9em; color: var(--muted); margin-top: 4px; }
ol.steps details.others { margin-top: 4px; font-size: .9em; color: var(--muted); }
ol.steps details.others summary { cursor: pointer; color: var(--link); }
#detail ol.steps details.others ul { margin: 4px 0 0; padding-left: 18px; }

/* The icon of each vehicle on a route of the map, in the middle of its part (map.js vehicleMarker) */
.route-icon { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface);
              color: var(--fg); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
.route-icon .icon { width: 15px; height: 15px; vertical-align: 0; }
.route-icon[hidden] { display: none; }   /* its part too short on the screen for it (map.js fitIcons) */

/* The line of each option, as the planner draws it */
.lines { margin: 8px 0 4px; } .lines .line { overflow-x: auto; } .lines svg { width: 100%; min-width: 560px; height: auto; display: block; font-size: 12px; }
.lines p.line-title { margin: 10px 0 0; font-weight: 600; }
