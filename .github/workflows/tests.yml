# Replays the saved checkpoints on every push and pull request: no network, no quota, under a minute of tests.
# Windows, because requirements.lock is the tested Windows environment.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    env:
      # The model clients are built when some test modules are imported and refuse to start without a key. Offline
      # they are never called, so any value does.
      GOOGLE_API_KEY: offline
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: env/.python-version
          cache: pip
          cache-dependency-path: env/requirements.lock
      - name: Install the tested environment
        run: |
          python -m pip install --no-deps -r env/requirements.lock
          python -m pip install -r env/requirements-dev.txt
      - name: Run the tests
        run: python -m pytest -q
